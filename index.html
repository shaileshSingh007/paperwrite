<style>
:root{--desk:#c6c9ce;--bar:#b4b8be;--ink:#23262b;--btn:#2b2e33;--btnink:#f1f2f4;--accent:#f2b84b;--sel:#2f6fe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.pb:hover{background:#42474e}.pb.on{background:var(--sel);border-color:var(--sel);color:#fff}.pb.back{background:var(--accent);color:#1b1d21;border-color:var(--accent);font-weight:600}

.pl input[type=color]{width:30px;height:22px;padding:0;border:1px solid #4a4f56;background:none}.pl input[type=range]{width:70px}
.sw{width:20px;height:20px;border:1px solid #6a7078;border-radius:3px;cursor:pointer;flex:none}
.pi{color:#aab0b8;font-size:12px;flex:none}.dng{background:#7a2b25;border-color:#a33}
#work{flex:1;overflow:auto;position:relative}
#stage{padding:14px;display:flex;justify-content:center;min-width:min-content}
.pg{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.3);flex:none}
.pg canvas{display:block}.ov,.ov>div{position:absolute;left:0;top:0}.ov{width:100%;height:100%}
.src{position:absolute;cursor:text}.src:hover{outline:1px solid var(--sel);background:rgba(47,111,228,.12)}
.op{position:absolute}.tx{white-space:pre;transform-origin:0 0;cursor:move;line-height:1.2}
.op.selo{outline:1.5px solid var(--sel);outline-offset:1px}.tx[contenteditable]{cursor:text;outline:1.5px solid var(--sel);background:rgba(255,255,255,.6)}

.tool-patch .pg,.tool-text .pg{cursor:crosshair}

#msg.on{opacity:1}

[contenteditable],input[type=text],input[type=number]{-webkit-user-select:text;user-select:text}

.sw{border-radius:0!important}

.in{position:absolute}.bt{display:flex;align-items:center;justify-content:center;font-weight:600;overflow:hidden;white-space:nowrap}
.imgb{position:absolute;pointer-events:none;outline:1px dashed rgba(47,111,228,.7)}
.rb{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:50%;background:var(--accent);color:#1b1d21;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sqp .svw{position:relative;width:180px;height:120px}.sqp canvas{display:block;width:180px;height:120px;border-radius:2px}.sqp i{position:absolute;width:12px;height:12px;border:2px solid #fff;box-shadow:0 0 0 1px #0007;margin:-6px 0 0 -6px;pointer-events:none}

.rg{display:flex;align-items:center;gap:8px;color:#aab0b8}.rg input{flex:1;accent-color:#9aa4b2;min-width:0}
.sqc{width:22px;height:22px;padding:0;border:1px solid #6a7078;border-radius:2px;background:none}
#pop{max-height:72vh;overflow:auto}#pop input[type=text],#pop input[type=number],#pop select{width:100%;box-sizing:border-box;background:#1d1f23;color:#e8eaed;border:1px solid #4a4f56;border-radius:4px;padding:5px}
body{touch-action:pan-x pan-y}
.card.wide{grid-column:1/-1}
.card.cmp .ovl{display:flex;align-items:center;justify-content:center;gap:6px}
.card.cmp .ci,.card.cmp .mid{position:static;transform:none;width:30px;height:30px;font-size:14px}.card.cmp .mid{display:contents}
.card.cmp .ci.mov{order:4}.card.cmp .ci.del{order:5}.card.cmp .num{display:none}
.btn{font-size:15px;min-width:40px}.pb{font-size:14px;min-width:34px}.pl{font-size:14px}
@keyframes rin{from{transform:rotate(-90deg) scale(.72);opacity:.35}to{transform:none;opacity:1}}.card canvas.rt{animation:rin .32s ease-out}
#cm{display:none;position:fixed;inset:0;z-index:55;background:rgba(20,22,25,.93);flex-direction:column;align-items:center;gap:12px;padding:12px;overflow:auto}.cbar{display:flex;gap:8px}
.cwrap{position:relative;flex:none;box-sizing:content-box}.cin{position:relative;overflow:hidden}.cbx{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}

.btn.on{background:var(--accent);color:#1b1d21}.card.drag{opacity:.25}

.selmode .ci,.selmode .mid{display:none}.chk{display:none;position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);color:#1b1d21;align-items:center;justify-content:center;font-weight:700}
.selmode .chk{display:flex}.selmode .card{cursor:pointer}.card.picked{outline:3px solid var(--accent)}.card.picked .chk{background:var(--accent);border-color:var(--accent)}
#mbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:8px;align-items:center;background:#1b1d21;color:#fff;padding:8px 10px;border-radius:8px;z-index:30;white-space:nowrap}
#pop{position:fixed;display:none;z-index:45;background:#25282c;color:#e8eaed;border:1px solid #4a4f56;border-radius:8px;padding:10px;gap:8px;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.4);width:210px}

.rh{position:absolute;width:12px;height:12px;background:var(--sel);border:2px solid #fff;border-radius:2px;cursor:nwse-resize;touch-action:none}
</style></head><body>

<div id="home">
 <div class="top"><button class="btn" id="up" title="Upload PDF or image"><i class="fa-solid fa-upload"></i></button><button class="btn" id="mrg" title="Merge pages"><i class="fa-solid fa-object-group"></i></button><span class="sp"></span>

 <div id="gridwrap"><div class="grid" id="grid"></div></div></div>

<div id="mbar"><span id="mc"></span><button class="btn" id="mh" title="Merge side by side" disabled><i class="fa-solid fa-arrows-left-right"></i></button><button class="btn" id="mv" title="Merge top to bottom" disabled><i class="fa-solid fa-arrows-up-down"></i></button><button class="btn" id="mx" title="Cancel"><i class="fa-solid fa-xmark"></i></button></div><div id="cm"></div><div id="xm"><button class="btn" id="xpdf" title="Download PDF"><i class="fa-solid fa-file-pdf"></i></button><button class="btn" id="xas" title="Save as"><i class="fa-solid fa-floppy-disk"></i></button><button class="btn" id="xpng" title="Pages as PNG (ZIP)"><i class="fa-solid fa-file-zipper"></i></button></div><div id="sv"><input id="svn" type="text"><button class="btn" id="svok" title="Save"><i class="fa-solid fa-check"></i></button><button class="btn" id="svx" title="Cancel"><i class="fa-solid fa-xmark"></i></button></div><input id="imgf" type="file" accept="image/*" hidden><div id="pop"></div><div id="msg"></div><input id="file" type="file" accept="application/pdf,image/*" multiple hidden>

<script>
const {PDFDocument,StandardFonts,rgb,degrees,PDFName,PDFString}=PDFLib,pj=window.pdfjsLib;

const FAM={Helvetica:'Helvetica,Arial,"Noto Sans Devanagari",sans-serif',Times:'"Times New Roman",Times,"Noto Sans Devanagari",serif',Courier:'"Courier New",Courier,"Noto Sans Devanagari",monospace',Devanagari:'"Noto Sans Devanagari",Helvetica,Arial,sans-serif'};

['gesturestart','gesturechange','gestureend'].forEach(n=>addEventListener(n,e=>e.preventDefault()));addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0'].includes(e.key))e.preventDefault()});

/* splash: 6 seconds */
'Pagewright'.split('').forEach((c,i)=>{const s=el('span');s.textContent=c;s.style.setProperty('--i',i);$('#word').append(s)});
setTimeout(()=>{$('#splash').classList.add('out');setTimeout(()=>$('#splash').remove(),700)},6000);
/* icons */
const fa=c=>'<i class="fa-solid fa-'+c+'"></i>';const IC={del:'trash',mov:'up-down-left-right',edit:'pen',rot:'rotate-right',crop:'crop-simple'};const icon=k=>fa(IC[k]);
/* geometry */
function geo(p,m,z){const t=((m.r0+p.rot)%360+360)%360,w=m.w,h=m.h,sw=t%180;

/* upload (multiple files are merged in order) */
$('#up').onclick=()=>{const f=$('#file');f.value='';f.click()};
async function readImg(file){const url=URL.createObjectURL(file),im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url}),k=Math.min(1,2200/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
 c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 const jpeg=/jpe?g/i.test(file.type),blob=await new Promise(r=>c.toBlob(r,jpeg?'image/jpeg':'image/png',.92)),id='i'+uid++;S.img[id]={c,url:URL.createObjectURL(blob),bytes:new Uint8Array(await blob.arrayBuffer()),jpeg};return id}

$('#file').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;say('Loading…');snap();
 try{for(const f of fs){const isImg=/^image\//.test(f.type)||/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name),bytes=isImg?await img2pdf(f):new Uint8Array(await f.arrayBuffer()),pdf=await pj.getDocument({data:bytes.slice()}).promise;
  S.docs.push({bytes,pdf});const d=S.docs.length-1,first=!S.pages.length;for(let i=1;i<=pdf.numPages;i++)S.pages.push({id:uid++,d,n:i,rot:0,ops:[]});if(first)S.fn=f.name.replace(/\.\w+$/,'')+'.pdf'}
  say(S.pages.length+' pages');refresh()}catch(x){say('Could not read file: '+x.message)}};

$('#undo').onclick=()=>restore(S.hist,S.fut);$('#redo').onclick=()=>restore(S.fut,S.hist);
addEventListener('keydown',e=>{if(e.target.isContentEditable||/INPUT|SELECT/.test(e.target.tagName))return;

 else if(S.view=='edit'&&(e.key=='Delete'||e.key=='Backspace')&&S.op)delOp()});

/* ---------- screen 2: page grid ---------- */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);paint(e.target,S.pages[e.target.dataset.i])}}),{root:$('#gridwrap'),rootMargin:'400px'});

 if(p.crop){const c=p.crop,w=c.x1-c.x0,h=c.y1-c.y0;pg.setMediaBox(c.x0,c.y0,w,h);pg.setCropBox(c.x0,c.y0,w,h)}
 for(const o of p.ops){
  if(o.t=='patch'){if(o.f){const im=await out.embedPng(await pngBytes(opCanvas(o,3)));pg.drawImage(im,{x:o.x,y:o.y,width:o.w,height:o.h,opacity:o.a})}
   else{const a={x:o.x,y:o.y,width:o.w,height:o.h,color:hx(o.bg),opacity:o.a};if(o.bw){a.borderColor=hx(o.bc);a.borderWidth=o.bw}pg.drawRectangle(a)}}
  else if(o.t=='img'){const I=S.img[o.im];let im;if(o.f||o.cover)im=await out.embedPng(await pngBytes(opCanvas(o,Math.min(4,Math.max(1,I.c.width/o.w)))));else im=ic[o.im]||(ic[o.im]=await(I.jpeg?out.embedJpg(I.bytes):out.embedPng(I.bytes)));pg.drawImage(im,{x:o.x,y:o.y,width:o.w,height:o.h,opacity:o.a})}
  else if(o.t=='btn'){const sz=Math.min(16,o.h*.5),lo={s:o.lb,sz,f:'Helvetica',b:true,i:false,c:o.fg};if(!o.inv)pg.drawRectangle({x:o.x,y:o.y,width:o.w,height:o.h,color:hx(o.bg)});

async function build(list){const out=await PDFDocument.create(),pgs=[];SRC={};LINKS=[];
 for(const p of list){const r=await drawInto(out,p,true);r.pg.setRotation(degrees(r.t));pgs.push(r.pg)}
 const ctx=out.context;
 for(const L of LINKS){const o=L.o,i=list.indexOf(L.p);let A;
  if(['goto','next','prev','first','last'].includes(o.act)){const ti=o.act=='goto'?list.findIndex(q=>q.id===o.tp):o.act=='next'?i+1:o.act=='prev'?i-1:o.act=='first'?0:list.length-1,tg=pgs[ti];if(!tg)continue;A=ctx.obj({S:'GoTo',D:[tg.ref,'Fit']})}
  else{if(!o.url)continue;A=ctx.obj({S:'URI',URI:PDFString.of(o.act=='mail'?'mailto:'+o.url:o.act=='tel'?'tel:'+o.url:o.url)})}
  L.pg.node.addAnnot(ctx.register(ctx.obj({Type:'Annot',Subtype:'Link',Rect:[o.x,o.y,o.x+o.w,o.y+o.h],Border:[0,0,0],A})))}
 return out.save()}
function deliver(blob,name){const u=URL.createObjectURL(blob),a=el('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>window.open(u,'_blank'),500)}
async function exportPdf(name){if(!S.pages.length)return;say('Building PDF…');try{deliver(new Blob([await build(S.pages)],{type:'application/pdf'}),name);say('Exported '+S.pages.length+' pages. If nothing downloaded, it opened in a new tab.')}catch(e){say('Export failed: '+e.message)}}
async function exportPng(){if(!S.pages.length)return;try{const Z=new JSZip();for(let i=0;i<S.pages.length;i++){say('Rendering page '+(i+1)+' / '+S.pages.length);const c=await renderPart(S.pages[i],1600),b=await new Promise(r=>c.toBlob(r,'image/png'));Z.file('page-'+String(i+1).padStart(3,'0')+'.png',b)}
 deliver(await Z.generateAsync({type:'blob'}),S.fn.replace(/\.pdf$/i,'')+'-pages.zip');say('ZIP ready')}catch(e){say('PNG export failed: '+e.message)}}
